<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine 💖</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      overflow: hidden; /* prevents scrollbars when No moves */
    }

    .card {
      background: white;
      padding: 50px 40px;
      border-radius: 25px;
      text-align: center;
      width: 380px;
      max-width: 90%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      position: relative;
      z-index: 10;
    }

    .emoji {
      font-size: 80px;
      margin-bottom: 15px;
    }

    h2 {
      margin: 0 0 35px 0;
      color: #333;
      font-size: 2em;
    }

    .buttons {
      position: relative;
      height: 80px; /* more space for No to move */
    }

    button {
      padding: 16px 40px;
      border: none;
      border-radius: 50px;
      font-size: 1.3em;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      position: absolute;
    }

    #yes {
      background: #ff4d6d;
      color: white;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
    }

    #yes:hover {
      transform: translateX(-50%) scale(1.1);
      background: #ff3366;
    }

    #no {
      background: #aaaaaa;
      color: #444;
      right: 20%;
      transform: translateX(0);
    }

    #no:hover {
      background: #999;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="emoji">🐱❤️</div>
    <h2>Queencila, will you be my Valentine?</h2>

    <div class="buttons">
      <button id="yes">Yes 💕</button>
      <button id="no">No 😿</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");

    // Make No run away on hover (and keep running if you chase it)
    noBtn.addEventListener("mouseover", () => {
      const maxX = window.innerWidth - noBtn.offsetWidth - 40;
      const maxY = window.innerHeight - noBtn.offsetHeight - 40;

      // Random position across most of the screen
      const newX = Math.random() * maxX;
      const newY = Math.random() * maxY;

      noBtn.style.position = "fixed";  // fixed so it moves relative to viewport
      noBtn.style.left = newX + "px";
      noBtn.style.top  = newY + "px";
      noBtn.style.transform = "none"; // remove any old transform
      noBtn.style.transition = "all 0.4s ease"; // smooth movement

      // Optional: make Yes a bit bigger each time you try to catch No
      const currentScale = yesBtn.style.transform.includes("scale") 
        ? parseFloat(yesBtn.style.transform.match(/scale\(([^)]+)\)/)?.[1] || 1)
        : 1;
      yesBtn.style.transform = translateX(-50%) scale(${Math.min(currentScale + 0.08, 1.6)});
    });

    // Yes → celebration screen
    yesBtn.addEventListener("click", () => {
      document.body.innerHTML = `
        <div style="
          height: 100vh;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          background: linear-gradient(135deg, #ff9a9e, #ffdde1);
          color: #fff;
          font-family: Arial, sans-serif;
          text-align: center;
          overflow: hidden;
        ">
          <h1 style="font-size: 4.5em; margin: 0 20px; text-shadow: 0 4px 10px rgba(0,0,0,0.3);">
            YAAAY! 🎉💖💖
          </h1>
          <p style="font-size: 2.5em; margin: 20px 0;">
            You're officially my Valentine, Queencila! 🥰😘
          </p>
          <img src="https://media.giphy.com/media/3o7TKsQ8J2y5kQJq4I/giphy.gif" alt="Confetti celebration" 
               style="max-width: 80%; max-height: 50vh; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
          <p style="font-size: 1.8em; margin-top: 30px;">
            I ❤️ you so much! 🌸✨
          </p>
        </div>
      `;
    });
  </script>

</body>
</html>
